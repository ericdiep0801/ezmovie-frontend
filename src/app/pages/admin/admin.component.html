<div class="admin-dashboard">
  <!-- Dynamic Background elements for Glassmorphism -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Glass Sidebar -->
  <aside class="admin-sidebar glass-panel" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo-wrapper">
        <i class="fas fa-database glow-icon"></i>
        <h2 class="sidebar-title">Admin</h2>
      </div>
      <button class="btn-toggle-sidebar" (click)="toggleSidebar()" title="Thu gọn/Mở rộng">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <div class="sidebar-back-action">
      <a routerLink="/" class="btn-back"><i class="fas fa-arrow-left"></i> <span class="sidebar-text">Về web</span></a>
    </div>

    <div class="tables-list custom-scrollbar">
      <div class="table-item" *ngFor="let table of tables" [class.active]="activeTable?.name === table.name"
        (click)="selectTable(table)">
        <i class="fas fa-table table-icon"></i>
        <span class="sidebar-text">{{ table.name }}</span>
        <div class="active-indicator"></div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <div class="glass-panel main-content-wrapper">
      <div class="main-header" *ngIf="activeTable">
        <div class="header-title">
          <h3>Bảng <span class="highlight">{{ activeTable.name }}</span></h3>
          <span class="record-badge">{{ tableData.length }} bản ghi</span>
        </div>
        <button class="btn-refresh glow-button" (click)="loadTableData()">
          <i class="fas fa-sync-alt" [class.fa-spin]="isLoading"></i> <span>Tải lại</span>
        </button>
      </div>

      <!-- Loading State -->
      <div class="loading-overlay" *ngIf="isLoading">
        <div class="loader-ring"></div>
        <span>Đang đồng bộ...</span>
      </div>

      <!-- Data Grid -->
      <div class="data-grid-container custom-scrollbar" *ngIf="activeTable && !isLoading">
        <table class="data-grid">
          <thead>
            <tr>
              <th *ngFor="let col of activeTable.columns">
                <div class="th-content">
                  <span class="col-name">
                    <i class="fas fa-key primary-key-icon" *ngIf="col.isPrimary" title="Khóa chính"></i>
                    {{ col.name }}
                  </span>
                  <span class="col-type badge-type">{{ col.type?.name || col.type }}</span>
                </div>
              </th>
              <th class="actions-col">Hành động</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of tableData" class="data-row" [class.row-new]="isNewToday(item)">
              <td *ngFor="let col of activeTable.columns" [class.is-primary]="col.isPrimary">
                <div class="input-wrapper" (click)="openCellValue(col.name, item, !!col.isPrimary)">
                  <input type="text" [value]="formatDisplayValue(item[col.name])" class="grid-input"
                    [class.primary-input]="col.isPrimary" readonly [placeholder]="col.isNullable ? 'NULL' : ''">
                  <button class="btn-view-value" title="Xem/Sửa chi tiết">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </td>
              <td class="actions-cell">
                <div class="action-buttons">
                  <button class="action-btn btn-delete" (click)="deleteRow(item)" title="Xóa dòng">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="tableData.length === 0">
              <td [attr.colspan]="activeTable.columns.length + 1" class="empty-state">
                <div class="empty-content">
                  <i class="fas fa-folder-open"></i>
                  <p>Bảng này chưa có dữ liệu.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Cell Value Viewer Modal -->
  <div class="value-viewer-modal" *ngIf="selectedCellValue">
    <div class="modal-backdrop" (click)="closeCellValue()"></div>
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3>Giá trị của <span class="highlight">{{ selectedCellValue.colName }}</span></h3>
        <button class="btn-close-modal" (click)="closeCellValue()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <textarea class="value-textarea custom-scrollbar" [(ngModel)]="selectedCellValue.value"
          [readonly]="selectedCellValue.isPrimary"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-copy glow-button" (click)="copyToClipboard(selectedCellValue.value)">
          <i class="fas fa-copy"></i> <span>Copy</span>
        </button>
        <button class="btn-save-modal glow-button" *ngIf="!selectedCellValue.isPrimary" (click)="saveCellValue()">
          <i class="fas fa-save"></i> <span>Lưu thay đổi</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="value-viewer-modal" *ngIf="confirmConfig">
    <div class="modal-backdrop" (click)="cancelConfirm()"></div>
    <div class="modal-content glass-panel confirm-modal-content">
      <div class="modal-header">
        <h3>Xác nhận</h3>
        <button class="btn-close-modal" (click)="cancelConfirm()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body confirm-body">
        <p>{{ confirmConfig.message }}</p>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel glow-button" (click)="cancelConfirm()">Hủy</button>
        <button class="btn-confirm glow-button" (click)="processConfirm()">Xác nhận</button>
      </div>
    </div>
  </div>
</div>
