<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Forgot Password</h2>
      <p *ngIf="step === 1">Enter your email to receive an <span class="logo-bold">EZ<span class="highlight">MOVIE</span></span> OTP code</p>
      <p *ngIf="step === 2">Enter the OTP sent to your email and set your new <span class="logo-bold">EZ<span class="highlight">MOVIE</span></span> password</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <!-- Step 1: Email -->
      <div *ngIf="step === 1">
        <app-input 
          id="email" 
          label="Email Address" 
          type="email" 
          formControlName="email" 
          placeholder="Enter your registered email"
          [errorMsg]="getErrorMessage('email')"
          [isValid]="isFieldValid('email')"
          [hasPrefix]="true">
          <svg prefix xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </app-input>

        <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem;">
          Send OTP Code
        </button>
      </div>

      <!-- Step 2: OTP & New Password -->
      <div *ngIf="step === 2">
        <app-input 
          id="otpCode" 
          label="OTP Code" 
          type="text" 
          formControlName="otpCode" 
          placeholder="Enter 6-digit code"
          [errorMsg]="getErrorMessage('otpCode')"
          [isValid]="isFieldValid('otpCode')"
          [hasPrefix]="true">
          <svg prefix xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </app-input>

        <app-input 
          id="newPassword" 
          label="New Password" 
          type="password" 
          formControlName="newPassword" 
          placeholder="Min 8 chars, 1 upper, 1 special"
          [errorMsg]="getErrorMessage('newPassword')"
          [isValid]="isFieldValid('newPassword')"
          [hasPrefix]="true">
          <svg prefix xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </app-input>

        <app-input 
          id="confirmPassword" 
          label="Confirm Password" 
          type="password" 
          formControlName="confirmPassword" 
          placeholder="Re-enter your new password"
          [errorMsg]="getErrorMessage('confirmPassword')"
          [isValid]="isFieldValid('confirmPassword')"
          [hasPrefix]="true">
          <svg prefix xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </app-input>

        <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem;">
          Reset Password
        </button>
      </div>
    </form>

    <div class="auth-footer" style="margin-top: 1.5rem;">
      <p>Remember your password? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
