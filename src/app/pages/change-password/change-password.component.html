<div class="modal-overlay" *ngIf="isOpen" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="btn-close" (click)="close()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="modal-header">
      <h2>Update Password</h2>
      <p>Secure your <span class="logo-bold">EZ<span class="highlight">MOVIE</span></span> account with a new password</p>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
      <app-input
        id="oldPassword"
        label="Current Password"
        type="password"
        formControlName="oldPassword"
        placeholder="Enter current password"
        [errorMsg]="getErrorMessage('oldPassword')"
        [isValid]="isFieldValid('oldPassword')"
        [hasPrefix]="true"
      >
        <svg prefix xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
        </svg>
      </app-input>

      <app-input
        id="newPassword"
        label="New Password"
        type="password"
        formControlName="newPassword"
        placeholder="New Password"
        [errorMsg]="getErrorMessage('newPassword')"
        [isValid]="isFieldValid('newPassword')"
        [hasPrefix]="true"
      >
        <svg prefix xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </app-input>

      <app-input
        id="confirmNewPassword"
        label="Confirm New Password"
        type="password"
        formControlName="confirmNewPassword"
        placeholder="Confirm New Password"
        [errorMsg]="getErrorMessage('confirmNewPassword')"
        [isValid]="isFieldValid('confirmNewPassword')"
        [hasPrefix]="true"
      >
        <svg prefix xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </app-input>

      <button type="submit" class="btn btn-primary" style="margin-top: 1rem">
        Update Password
      </button>
    </form>
  </div>
</div>
