<div class="input-group">
  <label *ngIf="label" [for]="id">{{ label }}</label>
  <div class="input-wrapper" 
       [class.is-focused]="isFocused"
       [class.has-error]="errorMsg || isValid === false"
       [class.is-valid]="isValid === true">
    
    <div class="input-prefix" *ngIf="hasPrefix">
      <ng-content select="[prefix]"></ng-content>
    </div>

    <input
      [id]="id"
      [type]="inputType"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="isDisabled"
      [attr.autocomplete]="autocomplete"
      (input)="onInputChange($event)"
      (change)="onInputChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      class="custom-input"
      [class.has-prefix]="hasPrefix"
      [class.has-suffix]="hasSuffix || type === 'password' || isValid !== null"
    />

    <div class="input-suffix">
      <ng-content select="[suffix]"></ng-content>
      
      <button
        *ngIf="type === 'password'"
        type="button"
        class="toggle-password-btn"
        (click)="togglePassword()"
        tabindex="-1"
      >
        <!-- Show Password Icon (Eye) -->
        <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <!-- Hide Password Icon (Eye Off) -->
        <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>

      <!-- Validation Icons -->
      <svg *ngIf="isValid === true" class="valid-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <svg *ngIf="isValid === false || errorMsg" class="invalid-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
  </div>
  <div class="input-error-msg" *ngIf="errorMsg">
    {{ errorMsg }}
  </div>
</div>
