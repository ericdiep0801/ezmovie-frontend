<div class="modal-overlay" *ngIf="isOpen" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="btn-close" (click)="close()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="modal-header">
      <h2>Edit Profile</h2>
      <p>Update your public information</p>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <!-- Avatar Upload -->
      <div class="avatar-upload">
        <div class="avatar-preview">
          <img [src]="previewUrl" 
               (error)="handleAvatarError($event)" 
               referrerpolicy="no-referrer" 
               alt="Avatar Preview">
          <label for="avatar-input" class="btn-edit-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
          </label>
        </div>
        <input id="avatar-input" type="file" (change)="onFileSelected($event)" accept="image/*" hidden>
        <p class="upload-hint">Recommended: Square image, max 2MB</p>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            id="username" 
            type="text" 
            formControlName="username" 
            placeholder="Your username"
            [class.invalid]="profileForm.get('username')?.invalid && profileForm.get('username')?.touched"
          >
        </div>
        <span class="error-text" *ngIf="profileForm.get('username')?.invalid && profileForm.get('username')?.touched">
          Username must be at least 3 characters
        </span>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="close()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="profileForm.invalid">Save Changes</button>
      </div>
    </form>
  </div>
</div>
