<div class="modal-overlay" *ngIf="isVisible" (click)="hide()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ 'SETTINGS.TITLE' | translate }}</h2>
      <button class="btn-close" (click)="hide()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Language Selection -->
      <div class="setting-group">
        <label class="setting-label">{{ 'SETTINGS.LANGUAGE' | translate }}</label>
        <div class="setting-options">
          <button class="setting-btn" [class.active]="currentLang === 'vi'" (click)="setLanguage('vi')">
            🇻🇳 {{ 'SETTINGS.VIETNAMESE' | translate }}
          </button>
          <button class="setting-btn" [class.active]="currentLang === 'en'" (click)="setLanguage('en')">
            🇺🇸 {{ 'SETTINGS.ENGLISH' | translate }}
          </button>
        </div>
      </div>

      <!-- Theme Selection -->
      <div class="setting-group">
        <label class="setting-label">{{ 'SETTINGS.THEME' | translate }}</label>
        <div class="setting-options">
          <button class="setting-btn" [class.active]="currentTheme === 'dark'" (click)="setTheme('dark')">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            {{ 'SETTINGS.THEME_DARK' | translate }}
          </button>
          <button class="setting-btn" [class.active]="currentTheme === 'light'" (click)="setTheme('light')">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            {{ 'SETTINGS.THEME_LIGHT' | translate }}
          </button>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-primary" (click)="hide()">{{ 'SETTINGS.CLOSE' | translate }}</button>
    </div>
  </div>
</div>
